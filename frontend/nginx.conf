server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver nội bộ của Docker - chống crash khi backend khởi động sau
    resolver 127.0.0.11 valid=30s;

    # Không cache file index.html để SPA luôn cập nhật bản mới nhất
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hỗ trợ React Router - mọi route đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls sang FastAPI backend (dùng biến để lazy-resolve tránh crash lúc boot)
    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
